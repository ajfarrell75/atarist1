# =============================================================================
#  Déploiement de la version WebAssembly de NeoST sur GitHub Pages.
#
#  Construit le frontend web (Emscripten) avec la liste autorisée des paquets
#  (NEOST_WEB_FREE_ONLY=ON) : EmuTOS 192/256 US+FR, TOS 1.02/1.62 UK (profils
#  ST/STE), les sons de lecteur et diskA.st.
#
#  ⚠ NE PAS repasser à OFF sur un dépôt PUBLIC. OFF embarque tout roms/ et
#  disks/ dans index.data, que Pages sert ensuite en clair : soit 44 images TOS
#  Atari propriétaires et une soixantaine de jeux commerciaux crackés, publiés
#  et indexables sous https://<utilisateur>.github.io/neost/. Ce workflow était
#  en OFF sous la condition, écrite ici même, que le dépôt reste PRIVÉ —
#  condition qui n'est pas remplie (habib256/neost est public). OFF n'est
#  utilisable qu'en local ou sur un dépôt réellement privé.
#
#  Prérequis côté dépôt : Settings → Pages → « Build and deployment » →
#  Source = « GitHub Actions ». Le site est alors publié sur
#  https://<utilisateur>.github.io/neost/
# =============================================================================
name: Déploiement web (WASM)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec sous-modules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Installer Emscripten
        uses: mymindstorm/setup-emsdk@v14

      # (l'étape « Générer les opcodes Musashi » a été retirée : le cœur Musashi
      # n'existe plus — Moira, vendorisé, se compile tel quel.)

      - name: Configurer (WASM, contenus LIBRES uniquement)
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release -DNEOST_WEB_FREE_ONLY=ON

      - name: Compiler le frontend web (sortie → wasm/)
        run: cmake --build build-web -j --target neost-web

      - name: Téléverser l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
